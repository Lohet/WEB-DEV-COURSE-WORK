<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta width="device-width" imagescale="1.0">
        <title>Document</title>
    </head>
    <body>
        <style>
            table,th,tr,td{
                border: 1px solid black;
                border-collapse: collapse;
            }
        </style>
        <title>Table</title>
        <table>
            <tr>
                <td>abcd</td>
                <td>abcd</td>
                <td>abcd</td>
            </tr>
            <tr>
                <td>abcd</td>
                <td rowspan="3">abcd</td>
                <td>abcd</td>
            </tr>
            <tr>
                <td>abcd</td>
                
                <td>abcd</td>
            </tr>
            <tr>
                <td>abcd</td>
                
                <td>abcd</td>
            </tr>
            <tr>
                <td>abcd</td>
                <td rowspan="2" colspan="2">abcd</td>
                
            </tr>
            <tr>
                <td>abcd</td>
                
            </tr>
        </table>
    </body>
</html>
