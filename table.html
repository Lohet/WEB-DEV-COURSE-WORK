<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta width="device-width" imagescale="1.0">
        <title>table</title>
        <style>
            table,th,tr,td{
                border: 1px solid black;
                border-collapse: collapse;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <table>
        <tr>
            <td rowspan="3">Day</td>
            <td colspan="3">Seminar</td>
        </tr>
        <tr>
            <td colspan="2">Schedule</td>
            <td rowspan="2" colspan="2">Topic</td>
        </tr>
        <tr>
            <td>Begin</td>
            <td>End</td>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td rowspan="2">8:00 am</td>
            <td rowspan="2">5:00 pm</td>
            <td>Introduction to XML</td>
        </tr>
        <tr>
            <td>Validity:DTD and Relax NG</td>
        </tr>
        <tr>
            <td rowspan="3">Tuesday</td>
            <td>8:00 am</td>
            <td>11:00 am</td>
            <td rowspan="1.5">XPath</td>
        </tr>
        <tr>
            <td>11:00 am</td>
            <td>2:00 pm</td>
            <td rowspan="1.5">XSL Transformation</td>
        </tr>
        <tr>
            <td>2:00 pm</td>
            <td>5:00 pm</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>8:00 am</td>
            <td>12:00 pm</td>
            <td>Xsl Formatting objects</td>
        </tr>
    </table>
    </body>
</html>
